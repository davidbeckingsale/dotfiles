---

- name: 'find configs'
  find:
    paths: '{{ playbook_dir }}/config/'
    depth: 2
    recurse: yes
  register: configs

- name: 'install config symlinks'
  file:
    src: "{{ item.path }}"
    path: "~/.{{ item.path | basename }}"
    state: link
    force: yes
  with_items: "{{ configs.files }}"